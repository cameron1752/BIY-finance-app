spring.application.name=financeapp
app.use.default=true
logging.config=classpath:logback.xml
# Connection URL (Default PostgreSQL port is 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/cam

# Database Credentials
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' automatically updates your schema based on entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
